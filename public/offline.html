<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09086f" />
    <title>App Hub is offline</title>
    <style>
      :root { color-scheme: light dark; }
      body { align-items: center; background: #f4f7fb; color: #162033; display: flex; font-family: Aptos, Segoe UI, sans-serif; justify-content: center; margin: 0; min-height: 100dvh; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); -webkit-text-size-adjust: 100%; }
      main { background: #fff; border: 1px solid #d8e0eb; border-radius: 28px; box-shadow: 0 18px 45px rgba(21, 35, 61, .12); max-width: 430px; padding: 32px; text-align: center; }
      span { color: #ff650d; font-size: 12px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
      h1 { color: #09086f; font-size: 28px; margin: 14px 0 12px; } p { color: #6f7d92; line-height: 1.6; margin: 0; }
      @media (prefers-color-scheme: dark) { body { background: #10182b; color: #f6f8fc; } main { background: #17223a; border-color: #2c3b56; } h1 { color: #f8fafc; } p { color: #b4bfd1; } }
    </style>
  </head>
  <body><main><span>App Hub</span><h1>You’re offline</h1><p>Your App Hub is still here. Reconnect to open workplace applications and continue where you left off.</p></main></body>
